name: Browser quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests and accessibility scans
        run: pnpm exec playwright test

      - name: Build production site for performance sampling
        run: pnpm run build

      - name: Record desktop and mobile production performance
        run: pnpm exec playwright test --config playwright.performance.config.mjs

      - name: Preserve browser diagnostics and baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-baselines
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
