name: README screenshots

# Recaptures the README feature tour from a fresh production build.
# - Manual run (any branch): captures and uploads the JPEGs as an artifact.
# - Push to a non-main branch that changes the capture spec: also commits the
#   refreshed images back to that branch for review in the pull request.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - tests/screenshots/**
      - playwright.readme.config.mjs
      - .github/workflows/readme-screenshots.yaml

permissions:
  contents: write

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the site's preferred fonts (Inter, Georgia)
        # The CSS asks for "Segoe UI", Inter / Georgia. Without these, Linux falls
        # back to DejaVu and the captures no longer match what most readers see.
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends fonts-inter ttf-mscorefonts-installer || sudo apt-get install -y --no-install-recommends fonts-inter
          fc-match Georgia; fc-match Inter

      - name: Capture the README feature tour
        run: pnpm run screenshots:readme

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: |
            docs/screenshots/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit refreshed screenshots to the branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: recapture README screenshots"
            git push
          fi
