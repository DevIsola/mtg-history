<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="344" viewBox="0 0 1440 344" role="img" aria-labelledby="title desc">
<title id="title">Three windows into Magic's history</title>
<desc id="desc">Original decorative triptych: an ancient spire, opposing artificers' machines, and an open portal between worlds.</desc>
<defs>
 <linearGradient id="panel" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#15262a"/><stop offset="1" stop-color="#0d191d"/></linearGradient>
